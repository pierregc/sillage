# The Linux check (#281): the shared kernel source compiled as CUDA and run on the CPU, and the
# portable Swift built and tested (#272), with no GPU. Free while the repository is public. It
# adds to ./scripts/dev.sh check on the Mac and replaces nothing: see docs/notes/no-ci.md.
name: linux

on:
  push:
    branches-ignore:
      - 'assets/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  cuda:
    # A branch of this repository is checked on its pushes; pull_request is for forks.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: The checks of ./scripts/dev.sh check that need no Mac
        run: |
          CXX=clang++ scripts/kernel-check.sh
          CXX=g++ scripts/kernel-check.sh
      - name: The CPU target, built and tested
        run: |
          CXX=g++ cuda/build.sh cpu
          CXX=clang++ cuda/build.sh cpu
      - name: nvcc and the CUDA headers, 13.5 as in docs/notes/cuda-walk-spike.md
        run: |
          curl -fsSLO https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cuda-nvcc-13-5 cuda-cudart-dev-13-5
      - name: The CUDA build for sm_120, compile only, and the two libraries the Swift links
        run: REQUIRE_NVCC=1 NVCC=/usr/local/cuda/bin/nvcc cuda/build.sh gpu libs

  # scripts/linux.sh check in four jobs side by side (#273, #278), so that the longest stays
  # under ten minutes: SillageCore's tests, SillageRender's, the formatter with the strict
  # concurrency typecheck, and the CUDA engine's tests on the CPU target with its command.
  swift-core:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    container: swift:6.2-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: SillageCore, built and tested
        run: scripts/linux.sh test-core

  swift-render:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    container: swift:6.2-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: SillageRender, built and tested
        run: scripts/linux.sh test-render

  swift-checks:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    container: swift:6.2-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: The formatter and the strict concurrency typecheck
        run: scripts/linux.sh lint strict

  swift-cuda:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    container: swift:6.2-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: ffmpeg, which encodes the full pass's videos (#278)
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ffmpeg > /dev/null
          ffmpeg -hide_banner -version | head -1
      - name: The CUDA engine's tests on the CPU target, and sillage-cuda
        run: scripts/linux.sh tool test-cuda
      - name: sillage-cuda draws a frame of a take as a PNG
        run: |
          .build/linux/sillage-cuda still Tests/Fixtures/engines/frames/take.sillage \
            --look Tests/Fixtures/engines/frames/webb.look.json --rate 30 --width 128 --height 72 \
            --frames 0 --out "$RUNNER_TEMP/stills"
          test -s "$RUNNER_TEMP/stills/1080p-0000.png"
      - name: sillage-cuda draws the frames of a flight inside a disk
        run: |
          .build/linux/sillage-cuda still Tests/Fixtures/engines/frames/take.sillage \
            --look Tests/Fixtures/engines/frames/webb.look.json --rate 30 --width 128 --height 72 \
            --flight Tests/Fixtures/engines/frames/inside.flight.json --seconds 0,3.5 \
            --out "$RUNNER_TEMP/stills"
          test -s "$RUNNER_TEMP/stills/1080p-flight-0003.50s.png"
      - name: sillage-cuda export draws a flight's video, killed after a segment and resumed
        run: |
          frames=Tests/Fixtures/engines/frames
          options="--look $frames/webb.look.json --flight $frames/inside.flight.json --rate 30"
          options="$options --width 64 --height 36 --fps 2 --segment-frames 1 --out $RUNNER_TEMP/flight/inside.mp4"
          .build/linux/sillage-cuda export $frames/take.sillage $options > "$RUNNER_TEMP/flight.log" &
          run=$!
          timeout 300 bash -c "until grep -q '^segment    2/9' '$RUNNER_TEMP/flight.log'; do sleep 0.1; done"
          kill -9 "$run"
          .build/linux/sillage-cuda export $frames/take.sillage $options --resume > "$RUNNER_TEMP/resumed.log"
          cat "$RUNNER_TEMP/resumed.log"
          grep -q '^segment    9/9' "$RUNNER_TEMP/resumed.log"
          if grep -q '^segment    1/9' "$RUNNER_TEMP/resumed.log"; then exit 1; fi
          test -s "$RUNNER_TEMP/flight/inside.mp4"
          test ! -e "$RUNNER_TEMP/flight/.inside.mp4.segments"
          .build/linux/sillage-cuda export $frames/take.sillage $options --resume > "$RUNNER_TEMP/again.log"
          grep -q 'nothing to draw' "$RUNNER_TEMP/again.log"
      - name: sillage-cuda holds the engine to the reference outputs, as a full pass requires
        run: .build/linux/sillage-cuda check --fixtures Tests/Fixtures/engines
      - name: sillage-cuda hires computes a scene folder explored on the Mac, killed after a checkpoint and resumed
        run: |
          scene="$RUNNER_TEMP/library/2026-10-30-b/scene-0031"
          mkdir -p "$scene"
          cp Tests/Fixtures/engines/scene/scene.json "$scene/"
          cp Tests/Fixtures/engines/frames/red-vs-cyan.look.json "$scene/look.json"
          echo '{"particles": 3000, "width": 256, "height": 144, "frames": 24, "fps": 6, "steps": 96, "settle": 12}' \
            > "$scene/clip.json"
          options="--particles 3000 --checkpoint-frames 4 --checkpoint-steps 4"
          .build/linux/sillage-cuda hires "$scene" $options > "$RUNNER_TEMP/first.log" &
          run=$!
          timeout 300 bash -c "until grep -q 'before frame 8' '$RUNNER_TEMP/first.log'; do sleep 0.1; done"
          kill -9 "$run"
          .build/linux/sillage-cuda hires "$scene" $options --resume | tee "$RUNNER_TEMP/second.log"
          grep -q '^resume     checkpoint' "$RUNNER_TEMP/second.log"
          test -s "$scene/take.sillage"
          test -s "$scene/hires.mov"
          test ! -e "$scene/.checkpoint"
          grep -q '"engine" : "cuda-cpu"' "$scene/hires.json"
          grep -q '"resumes" : 1' "$scene/hires.json"
